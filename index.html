<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#16324f">
<title>KontaFin</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<!-- ================= CABECERA FIJA ================= -->
<header class="kf-header">
  <button class="kf-btn-icono" id="kf-btn-menu" type="button" aria-label="Abrir menú">&#9776;</button>
  <div class="kf-header-titulo">
    <span class="kf-logo-mini">K</span>
    <span class="kf-nombre-app">KontaFin</span>
  </div>
  <button class="kf-btn-negocio" id="kf-btn-negocio" type="button" title="Mis Negocios">
  <span style="margin-right:4px;">👥</span><span id="kf-negocio-nombre">Mi Negocio</span>
</button>
</header>

<!-- ================= MENÚ LATERAL DESPLEGABLE ================= -->
<div class="kf-menu-fondo" id="kf-menu-fondo"></div>
<nav class="kf-menu" id="kf-menu">
  <div class="kf-menu-cabecera">
    <span class="kf-logo-mini">K</span>
    <span class="kf-nombre-app">KontaFin</span>
  </div>
  <ul class="kf-menu-lista" id="kf-menu-lista"></ul>
  <div class="kf-menu-pie">
    <small>OSTICOR &copy; KontaFin</small>
  </div>
</nav>

<!-- ================= CONTENEDOR DE MÓDULOS ================= -->
<!-- Aquí cada modulo .js inyecta su propia estructura visual -->
<main class="kf-contenido" id="kf-contenido"></main>

<!-- ================= MODAL GENÉRICO ================= -->
<div class="kf-modal-fondo" id="kf-modal-fondo"></div>
<div class="kf-modal" id="kf-modal">
  <div class="kf-modal-cabecera">
    <h3 id="kf-modal-titulo">Título</h3>
    <button class="kf-btn-icono" id="kf-modal-cerrar" type="button">&#10005;</button>
  </div>
  <div class="kf-modal-cuerpo" id="kf-modal-cuerpo"></div>
  <div class="kf-modal-pie">
    <button class="kf-btn kf-btn-gris" id="kf-modal-cancelar" type="button">Cancelar</button>
    <button class="kf-btn kf-btn-dorado" id="kf-modal-guardar" type="button">Guardar</button>
  </div>
</div>

<!-- ================= AVISO FLOTANTE ================= -->
<div class="kf-toast" id="kf-toast"></div>

<!-- ================= SCRIPTS ================= -->
<!-- Orden importante: app.js primero, luego los modulos -->
<script src="jspdf.umd.min.js"></script>
<script src="xlsx.full.min.js"></script>
<script src="app.js"></script>
<script src="inicio.js"></script>
<script src="inventario.js"></script>
<script src="ventas.js"></script>
<script src="compras.js"></script>
<script src="efectivo.js"></script>
<script src="gastos.js"></script>
<script src="ingresos.js"></script>
<script src="cuentas-cobrar.js"></script>
<script src="cuentas-pagar.js"></script>
<script src="cuentas-personalizadas.js"></script>
<script src="capital.js"></script>
<script src="resultados.js"></script>
<script src="balance.js"></script>
<script src="analisis-costos.js"></script>
<script src="analisis-financiero.js"></script>
<script src="reportes.js"></script>
<script src="configuracion.js"></script>
<script src="clientes.js"></script>

</body>
</html>
